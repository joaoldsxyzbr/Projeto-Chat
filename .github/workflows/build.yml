name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate PWA files
        run: |
          node --check public/sw.js
          node --check public/pwa-boot.js
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest', 'utf8'))"

      - name: Build
        run: npm run build
